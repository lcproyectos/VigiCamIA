name: Compilar APK VigiCamIA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar modelo IA dentro del APK
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/efficientdet_lite0.tflite "https://googleapis.com"

      - name: Crear AndroidManifest con giro libre
        run: |
          mkdir -p app/src/main
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VigiCamIA-Universal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
